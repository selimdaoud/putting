<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Putt au ralenti</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;background:#0a1208;overflow:hidden;
    font:13px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#e8efdf}
  canvas{display:block;width:100vw;height:100vh;cursor:grab}
  canvas:active{cursor:grabbing}
  canvas#c{touch-action:none}
  html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #panel{max-height:calc(100vh - 32px);overflow:auto}
  #hidebtn{position:fixed;left:50%;top:10px;transform:translateX(-50%);width:auto;margin:0;padding:6px 14px;border-radius:999px;background:rgba(10,18,8,.55);color:#e8efdf;font-weight:500;font-size:12px;border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:9}
  #panel{position:fixed;left:16px;bottom:16px;width:260px;padding:14px 16px;border-radius:14px;
    background:rgba(10,18,8,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.08)}
  #panel h1{font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 10px;font-weight:600;color:#bfe08a}
  .row{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;margin:6px 0}
  .row label{opacity:.8}
  .row output{text-align:right;font-variant-numeric:tabular-nums;opacity:.7}
  input[type=range]{width:100%;accent-color:#a8d65a}
  .chk{display:flex;gap:8px;align-items:center;margin:6px 0;opacity:.85}
  button{margin-top:8px;width:100%;padding:8px;border:0;border-radius:9px;background:#a8d65a;color:#12200a;
    font-weight:600;cursor:pointer}
  button:hover{background:#c0ea74}
  #hud{position:fixed;right:18px;top:16px;text-align:right;font-variant-numeric:tabular-nums;
    text-shadow:0 1px 8px rgba(0,0,0,.6);line-height:1.6}
  #hud b{font-size:22px;font-weight:500;color:#fff}
  #hud span{opacity:.65;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-left:6px}
  #hint{position:fixed;left:18px;top:16px;opacity:.6;font-size:11px;letter-spacing:.06em;text-shadow:0 1px 6px #000}
  #chartbox{position:fixed;right:16px;bottom:16px;width:620px;border-radius:10px;overflow:hidden;background:#fff;color:#111;
    box-shadow:0 6px 30px rgba(0,0,0,.45)}
  #chartbox h2{margin:0;padding:7px 0 8px;text-align:center;font:500 24px/1.1 "Helvetica Neue",Helvetica,Arial,sans-serif;
    background:#9d9d9d;color:#fff;letter-spacing:.01em}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.12);border-radius:9px;padding:2px}
  .seg button{margin:0;padding:5px 0;background:transparent;color:#e8efdf;font-weight:500;border-radius:7px}
  .seg button:hover{background:rgba(255,255,255,.1)}
  .seg button.on{background:#a8d65a;color:#12200a;font-weight:600}
  #chartbox h2{position:relative;cursor:pointer;user-select:none}
  #chartmin{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;margin:0;padding:0;border-radius:6px;
    background:rgba(255,255,255,.22);color:#fff;font:600 22px/1 Helvetica,Arial,sans-serif}
  #chartmin:hover,#chartclear:hover{background:rgba(255,255,255,.4)}
  #chartclear{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:auto;height:30px;margin:0;padding:0 12px;border-radius:6px;background:rgba(255,255,255,.22);color:#fff;font:500 15px/1 Helvetica,Arial,sans-serif}
  #chartbox.min #chart{display:none}
  #chart{width:100%;height:270px;display:block;cursor:default}
  #pad{z-index:5;position:fixed;left:16px;top:44px;width:min(584px,calc(100vw - 32px));border-radius:12px;overflow:hidden;color:#e8efdf;
    background:rgba(10,18,8,.80);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1)}
  #pad[hidden]{display:none}
  #pad h2{margin:0;padding:8px 12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:#bfe08a;
    display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
  #pad h2 .btns{display:flex;gap:6px}
  #pad h2 button{width:24px;height:24px;margin:0;padding:0;border-radius:6px;background:rgba(255,255,255,.14);color:#fff;font-size:15px;line-height:1}
  #pad.min #padbody{display:none}
  #padbody{padding:0 12px 12px}
  #padc{display:block;width:100%;height:auto;aspect-ratio:560/220;border-radius:8px;cursor:crosshair;touch-action:none;background:#0d1a0b}
  .padrow{display:grid;grid-template-columns:90px 1fr 56px;gap:8px;align-items:center;margin:8px 0 0}
  .padrow output{text-align:right;opacity:.7;font-variant-numeric:tabular-nums}
  .padbtns{display:flex;gap:8px;margin-top:10px}
  .padbtns button{margin:0;flex:1;padding:7px}
  .padbtns button.ghost{background:rgba(255,255,255,.14);color:#e8efdf;font-weight:500}
  #plaus{display:flex;gap:12px;align-items:center;margin-top:10px;padding:8px;border-radius:8px;background:rgba(255,255,255,.06)}
  #plaus canvas{width:104px;height:104px;flex:none}
  #plausTxt{font-size:12px;line-height:1.5;font-variant-numeric:tabular-nums}
  #plausTxt b{display:block;font-size:13px;margin-bottom:2px}
  #padstats{margin-top:10px;font-size:12px;line-height:1.55;display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;font-variant-numeric:tabular-nums}
  #padstats div{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.07);padding:1px 0}
  #padstats span{opacity:.65}
  @media (max-width:900px){#chartbox{width:calc(100vw - 340px)}}
  @media (max-width:640px){#chartbox{display:none}}
  @media (pointer:coarse){
    button{min-height:44px}
    .seg button{min-height:40px}
    input[type=range]{height:34px}
    .chk{min-height:36px}
    .row{margin:9px 0}
    #chartmin{width:40px;height:40px}
    #chartclear{height:40px;padding:0 16px}
    #pad h2 button{width:38px;height:38px}
    #hidebtn{min-height:38px}
  }
  @media (max-width:640px){#panel{width:auto;right:12px;left:12px;bottom:12px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="hidebtn" type="button">Masquer l'interface</button>
<div id="hint">Glisser : orbiter · Molette : zoom · Espace : rejouer · H : masquer l'interface</div>
<div id="hud"></div>
<div id="chartbox"><h2><button id="chartclear" title="Effacer les courbes" aria-label="Effacer">Clear</button><span>Stroke Dynamics</span><button id="chartmin" title="Réduire / agrandir" aria-label="Réduire">–</button></h2><canvas id="chart"></canvas></div>
<div id="pad" hidden>
  <h2><span>Dessiner le swing · vue de dessus</span><span class="btns"><button id="padmin" aria-label="Réduire">–</button><button id="padclose" aria-label="Fermer">×</button></span></h2>
  <div id="padbody">
    <canvas id="padc"></canvas>
    <div class="padrow"><label>Sensibilité</label><input id="pads" type="range" min="0.5" max="2" step="0.05" value="1"><output></output></div>
    <div class="padrow"><label>Inertie club</label><input id="padi" type="range" min="0" max="90" step="5" value="35"><output></output></div>
    <div class="padrow"><label>Face (°)</label><input id="padf" type="range" min="-4" max="4" step="0.25" value="0"><output></output></div>
    <div class="padbtns"><button id="padreplay">Rejouer mon swing</button><button id="padauto" class="ghost">Swing automatique</button></div>
    <div id="plaus" hidden><canvas id="plausc"></canvas><div id="plausTxt"></div></div>
    <div id="padstats"></div>
  </div>
</div>
<div id="panel">
  <h1>Putt · physique réaliste</h1>
  <div class="row"><label>Ralenti</label><input id="slow" type="range" min="0.02" max="1" step="0.01" value="1"><output></output></div>
  <div class="row"><label>Distance putt</label><input id="dist" type="range" min="0.5" max="12" step="0.1" value="4"><output></output></div>
  <div class="row"><label>Loft (°)</label><input id="loft" type="range" min="-4" max="8" step="0.5" value="3"><output></output></div>
  <div class="row"><label>Stimp (green)</label><input id="stimp" type="range" min="6" max="14" step="0.5" value="10"><output></output></div>
  <div class="row"><label>Flou (DoF)</label><input id="blur" type="range" min="0" max="2" step="0.05" value="1"><output></output></div>
  <div class="row" style="grid-template-columns:96px 1fr"><label>Caméra</label>
    <div class="seg" id="camseg" role="group" aria-label="Caméra">
      <button type="button" data-cam="putter">Putter</button><button type="button" data-cam="ball">Ball</button>
    </div></div>
  <label class="chk"><input id="lite" type="checkbox"> Mode léger (plus fluide)</label>
  <label class="chk"><input id="line" type="checkbox" checked> Ligne de putt idéale</label>
  <label class="chk"><input id="loop" type="checkbox"> Rejouer en boucle</label>
  <button id="drawbtn" class="ghostbtn" style="background:rgba(255,255,255,.14);color:#e8efdf">✎ Dessiner mon swing</button>
  <button id="replay">Rejouer</button>
</div>

<script src="three.min.js"></script>
<script>
(() => {
'use strict';
const T = THREE;

/* ───────────── constantes physiques (SI) ───────────── */
const R = 0.021335;            // rayon balle (42.67 mm)
const M_BALL = 0.04593;        // masse balle (45.93 g)
const I_BALL = 0.4 * M_BALL * R * R;
const G = 9.81;
const M_EFF = 0.36;            // masse effective de la tête de putter à l'impact
const E_FACE = 0.78;           // coefficient de restitution face/balle
const MU_FACE = 0.35;          // frottement face/balle
const K_HERTZ = 6.5e7;         // raideur de contact (N/m^1.5) → durée de contact ≈ 0,4–0,5 ms
const I_HEAD = 4e-4;           // inertie de la tête (kg·m²)
const TAU_REACT = 0.008;       // les mains ramènent la tête sur sa trajectoire en ≈ 8 ms
const MU_GRASS = 0.45;         // frottement de glissement balle/gazon
const E_GRASS = 0.30;          // restitution verticale sur le green
const Y_REST = R - 0.0007;     // la balle s'enfonce légèrement dans le gazon
// Golfeur de 1,75 m : pivot = milieu des épaules (haut du sternum) en posture de putting.
// hanche ≈ 0,88 m, buste 0,50 m incliné de 35° → épaules ≈ 0,88 + 0,50·cos35° ≈ 1,29 m
const SHOULDER_H = 1.29;
const L_PEND = SHOULDER_H;     // rayon pivot → semelle (m)
const T_FWD = 0.30;            // durée de la descente (s) : le tempo reste ~constant, c'est l'amplitude qui varie
const T_BACK = 0.60;           // durée de l'arrière-swing (s)
const THETA_I = 0.0155;        // impact ~2 cm APRÈS le point bas (frappe légèrement montante)
const T_FOL = 0.47;            // durée de l'accompagnement (s)
const LIE = 70 * Math.PI / 180, LEAN = 3 * Math.PI / 180;   // lie 70°, manche penché de 3° vers la cible

const qs0 = new URLSearchParams(location.search);
let lite = qs0.has('lite') ? qs0.get('lite') !== '0' : (navigator.maxTouchPoints > 1 && /Macintosh|iPad|iPhone/.test(navigator.userAgent));
let grassGeo = null;
const params = { slow: 1, dist: 4, vp: 1.35, loft: 3.0, psi0: 0, stimp: 10, blur: 1, ramp: true, loop: false, line: true, inert: 35 };
const qs = new URLSearchParams(location.search);
const debugT = qs.has('t') ? parseFloat(qs.get('t')) : null;

/* ───────────── rendu ───────────── */
const canvas = document.getElementById('c');
const renderer = new T.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: debugT !== null });
const scene = new T.Scene();
const camera = new T.PerspectiveCamera(20, 16 / 9, 0.05, 80);
let rt;
function makeRT(w, h) {
  const r = new T.WebGLRenderTarget(w, h, { type: T.HalfFloatType, minFilter: T.LinearFilter, magFilter: T.LinearFilter });
  r.depthTexture = new T.DepthTexture(w, h, T.UnsignedIntType);
  return r;
}

const SUN_DIR = new T.Vector3(0.6, 0.5, 0.65).normalize();

/* ───────────── lumières ───────────── */
const key = new T.DirectionalLight(0xffe2b0, 1.9); key.position.copy(SUN_DIR); scene.add(key);
const rim = new T.DirectionalLight(0xffd79a, 1.2); rim.position.set(-0.3, 0.35, -0.9); scene.add(rim);
scene.add(new T.HemisphereLight(0xcfe0ff, 0x3a6a14, 0.55));

/* ───────────── PRNG ───────────── */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ───────────── gazon ───────────── */
const U = {
  uCenter: { value: new T.Vector2() },
  uSize: { value: new T.Vector2(0.9, 0.56) },
  uFade: { value: 1 },
  uBall: { value: new T.Vector3() },
  uHead: { value: new T.Vector4(-1, 0, 0, 0) }, // x = avant de la face, y = hauteur semelle
};
const AO_GLSL = `
  uniform vec3 uBall; uniform vec4 uHead;
  float aoAt(vec2 p){
    float d = distance(p, uBall.xz + vec2(-0.004, -0.003));
    float a = 1. - .78*(1. - smoothstep(${R.toFixed(5)}*.35, ${R.toFixed(5)}*2.3, d));
    vec2 q = p - vec2(uHead.x - .025, 0.);
    vec2 dd = abs(q) - vec2(.027, .056);
    float sd = length(max(dd, 0.)) + min(max(dd.x, dd.y), 0.);
    float h = clamp(uHead.y*18., 0., 1.);
    a *= 1. - .75*(1. - smoothstep(0., .02 + uHead.y*.8, sd))*(1.-h*.7);
    return a;
  }`;
{
  const N = 450000, rand = rng(7);
  const bg = new T.InstancedBufferGeometry(); grassGeo = bg;
  bg.setAttribute('position', new T.BufferAttribute(new Float32Array(9), 3));
  bg.setAttribute('aV', new T.BufferAttribute(new Float32Array([0, 1, 2]), 1));
  const off = new Float32Array(N * 2), rnd = new Float32Array(N * 4);
  for (let i = 0; i < N; i++) {
    off[i * 2] = rand() * 0.9; off[i * 2 + 1] = rand() * 0.56;
    rnd[i * 4] = rand(); rnd[i * 4 + 1] = rand() * 6.2832; rnd[i * 4 + 2] = 0.2 + rand() * 0.9; rnd[i * 4 + 3] = rand();
  }
  bg.setAttribute('aOff', new T.InstancedBufferAttribute(off, 2));
  bg.setAttribute('aRnd', new T.InstancedBufferAttribute(rnd, 4));
  const mat = new T.ShaderMaterial({
    side: T.DoubleSide, uniforms: U,
    vertexShader: `
      attribute float aV; attribute vec2 aOff; attribute vec4 aRnd;
      uniform vec2 uCenter, uSize; uniform float uFade;
      varying float vH; varying vec4 vR; varying vec3 vW;
      void main(){
        vec2 rel = mod(aOff - uCenter + uSize*.5, uSize) - uSize*.5;
        vec2 p = uCenter + rel;
        vec2 e = abs(rel)/(uSize*.5);
        float edge = 1. - smoothstep(.72, 1., max(e.x, e.y));
        float h = (0.0030 + 0.0034*aRnd.x) * edge * uFade;
        vec2 dir = vec2(cos(aRnd.y), sin(aRnd.y));
        vec2 sd = vec2(-dir.y, dir.x) * 0.00016;
        vec3 pos;
        if(aV < .5){ pos = vec3(p.x + sd.x, 0., p.y + sd.y); vH = 0.; }
        else if(aV < 1.5){ pos = vec3(p.x - sd.x, 0., p.y - sd.y); vH = 0.; }
        else { pos = vec3(p.x + dir.x*aRnd.z*h*.9, h, p.y + dir.y*aRnd.z*h*.9); vH = 1.; }
        vR = aRnd; vW = pos;
        gl_Position = projectionMatrix * viewMatrix * vec4(pos, 1.);
        if(uFade < .01) gl_Position = vec4(2., 2., 2., 1.);
      }`,
    fragmentShader: `
      varying float vH; varying vec4 vR; varying vec3 vW;
      ${AO_GLSL}
      void main(){
        vec3 base = mix(vec3(.025,.10,.012), vec3(.10,.36,.04), vR.w);
        vec3 tip  = mix(vec3(.30,.62,.08), vec3(.62,.78,.14), vR.x);
        vec3 col = mix(base, tip, smoothstep(0., 1., vH));
        float spark = smoothstep(.55, 1., vH) * smoothstep(.45, 1., vR.w*.6 + vR.x*.5 + .15);
        col += vec3(1.9,1.45,.55) * spark * .9;
        col *= .75 + .55*vH;
        col *= aoAt(vW.xz);
        gl_FragColor = vec4(col, 1.);
      }`
  });
  const grass = new T.Mesh(bg, mat); grass.frustumCulled = false; scene.add(grass);

  // sol de base (au-delà des brins) : même palette, bruit
  const ground = new T.Mesh(new T.PlaneGeometry(120, 120).rotateX(-Math.PI / 2), new T.ShaderMaterial({
    uniforms: U,
    vertexShader: 'varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }',
    fragmentShader: `varying vec3 vW; ${AO_GLSL}
      float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
      float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
        return mix(mix(h21(i),h21(i+vec2(1,0)),f.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x), f.y); }
      void main(){
        vec2 p = vW.xz;
        float n = vn(p*350.)*.5 + vn(p*90.)*.3 + vn(p*8.)*.2;
        float far = smoothstep(.3, 12., length(vW.xz));
        vec3 c = mix(vec3(.06,.2,.03), vec3(.30,.50,.07), n);
        c = mix(c, vec3(.38,.45,.10)*(.8+.5*vn(p*.6)), far*.6);
        c *= aoAt(p);
        gl_FragColor = vec4(c, 1.);
      }`
  }));
  scene.add(ground);
}

/* ───────────── décor lointain (bokeh) ───────────── */
{
  const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 256;
  const g = cv.getContext('2d'), r = rng(3);
  const lg = g.createLinearGradient(0, 256, 0, 0);
  lg.addColorStop(0, '#6a8a22'); lg.addColorStop(.25, '#3d5c14'); lg.addColorStop(.6, '#16300c'); lg.addColorStop(1, '#0a1a08');
  g.fillStyle = lg; g.fillRect(0, 0, 1024, 256);
  for (let i = 0; i < 260; i++) {
    const x = r() * 1024, y = 20 + r() * 220, rad = 10 + r() * 40, a = .15 + r() * .35;
    const warm = r() < .35;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, warm ? `rgba(200,190,70,${a})` : `rgba(10,30,8,${a + .1})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  const tex = new T.CanvasTexture(cv); tex.encoding = T.sRGBEncoding; tex.wrapS = T.RepeatWrapping;
  const back = new T.Mesh(new T.CylinderGeometry(22, 22, 14, 48, 1, true), new T.MeshBasicMaterial({ map: tex, side: T.BackSide, color: new T.Color(1.5, 1.5, 1.4) }));
  back.position.y = 4; scene.add(back);
  // points lumineux lointains
  const r2 = rng(11), geo = new T.SphereGeometry(0.06, 6, 4), m = new T.MeshBasicMaterial({ color: new T.Color(5, 4.2, 2) });
  for (let i = 0; i < 90; i++) {
    const s = new T.Mesh(geo, m), a = r2() * 6.28, d = 6 + r2() * 12;
    s.position.set(Math.cos(a) * d, 0.3 + r2() * 4, -Math.abs(Math.sin(a)) * d - 2); s.scale.setScalar(.5 + r2() * 1.5); scene.add(s);
  }
}

/* ───────────── balle de golf (alvéoles en vraie géométrie) ───────────── */
const ball = new T.Mesh(buildBallGeo(), new T.MeshPhysicalMaterial({
  color: 0xf6f5f0, roughness: .42, clearcoat: .5, clearcoatRoughness: .3
}));
scene.add(ball);
/* ligne de putt idéale : trait pointillé au sol de la balle jusqu'au trou */
const lineTex = (() => { const c = document.createElement('canvas'); c.width = 64; c.height = 8; const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, 40, 8); const t = new T.CanvasTexture(c); t.wrapS = T.RepeatWrapping; t.anisotropy = 8; return t; })();
const lineMesh = new T.Mesh(new T.PlaneGeometry(1, 0.007).rotateX(-Math.PI / 2),
  new T.MeshBasicMaterial({ color: 0xfff0a8, map: lineTex, alphaTest: .5, side: T.DoubleSide }));
const holeMesh = new T.Group();
{ const d = new T.Mesh(new T.CircleGeometry(0.054, 48).rotateX(-Math.PI / 2), new T.MeshBasicMaterial({ color: 0x0a0a08 }));
  const r = new T.Mesh(new T.RingGeometry(0.054, 0.060, 48).rotateX(-Math.PI / 2), new T.MeshBasicMaterial({ color: 0xfff0a8 }));
  r.position.y = 0.0006; holeMesh.add(d, r); }
const lineGrp = new T.Group(); lineGrp.add(lineMesh, holeMesh); lineGrp.position.y = 0.0045; scene.add(lineGrp);
function updateLine() {
  const L = Math.max(0.05, params.dist - R); lineMesh.scale.x = L; lineMesh.position.x = R + L / 2;
  lineTex.repeat.x = L / 0.03; holeMesh.position.x = params.dist; lineGrp.visible = params.line;
}
function buildBallGeo() {
  const g = new T.SphereGeometry(R, 256, 128);
  const pos = g.attributes.position, nor = g.attributes.normal;
  const N = 336, pts = [], ga = Math.PI * (3 - Math.sqrt(5));

const padStats = $('padstats');

const plausEl = $('plaus'), plausC = $('plausc'), plausTxt = $('plausTxt');
function drawPlaus() {

  c.beginPath(); c.arc(g.mx, g.my, 2.5, 0, 7); c.fillStyle = '#6ec1ff'; c.fill();

}

/* ───────────── boucle ───────────── */
const H_STEP = 0.0004;
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;

  // échelle de temps
  let target = 1;
  if (!params.ramp) target = params.slow;
  else if (S.traj ? S.t < S.traj.tEnd + 0.05 : (!S.hit || S.thd > 0)) target = params.slow;          // ralenti du début à la fin du swing (putter à l'arrêt)
  else {                                                         // swing terminé : retour progressif au temps réel

  let sim = dt * S.scale;
  if (sim > 0) { const n = Math.min(300, Math.ceil(sim / H_STEP)); for (let i = 0; i < n; i++) stepPhysics(sim / n); }

  if (S.stopped) { S.stopT += dt; if (params.loop && S.stopT > 1.8 && debugT === null) reset(); }

  render(dt);
}

const chart = document.getElementById('chart'), cctx = chart.getContext('2d');
function drawChart() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2), W = chart.clientWidth, H = chart.clientHeight;
  if (!W) return;
  if (chart.width !== Math.round(W * dpr) || chart.height !== Math.round(H * dpr)) { chart.width = Math.round(W * dpr); chart.height = Math.round(H * dpr); }

  const all = trials.concat(S.cur ? [S.cur] : []);

function camX2() { return S.pivot.x - 0.025; }
function render(dt) {

resize(); reset();
if (qs.has('pad')) padEl.hidden = false;
if (qs.has('demo')) {   // test : geste synthétique (recul 0,6 s, descente ~0,3 s, léger tremblement latéral)
  padEl.hidden = false; if (qs.has('inert')) { $('padi').value = qs.get('inert'); $('padi').dispatchEvent(new Event('input')); }
  const g = padGeom(), sm = pad.s_mm / 1000, ts = [], xs = [], ys = [], r = rng(9);
  const e5 = u => u * u * u * (10 - 15 * u + 6 * u * u);
  for (let tt = 0; tt < (qs.has('cut') ? 0.97 : 1.25); tt += 0.008) {
    let X; if (qs.has('short')) { if (tt < 0.2) X = -0.03 * e5(tt / 0.2); else if (tt < 0.5) X = -0.03; else { const d = tt - 0.5, d1 = 0.0405; if (d < d1) X = -0.03 + 18.5 * d * d; else { const e = Math.min(0.15, d - d1); X = -0.03 + 18.5 * d1 * d1 + 1.5 * e - 5 * e * e; } } } else if (tt < 0.6) X = -0.2 * e5(tt / 0.6); else if (tt < 0.66) X = -0.2; else { const d = tt - 0.66; X = -0.2 + 0.5 * 5.2 * d * d - (d > 0.32 ? 0.5 * 9 * (d - 0.32) * (d - 0.32) : 0); }
    const Z = 0.004 * Math.sin(tt * 6.2) + (qs.has('push') ? 0.018 * Math.max(0, tt - 0.66) : 0) + (r() - 0.5) * 0.0006;

}
if (debugT !== null) {   // mode capture : avance la simulation jusqu'à t puis fige
  let n = Math.round(debugT / H_STEP); while (n-- > 0) stepPhysics(H_STEP);
}
requestAnimationFrame(frame);
window.__sim = S;
})();
